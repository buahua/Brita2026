let searchTerm = '';

function sorted() {
  return [...guests].sort((a,b) => {
    const lc = a.last.localeCompare(b.last);
    return lc !== 0 ? lc : a.first.localeCompare(b.first);
  });
}

function grouped(list) {
  const map = {};
  for (const g of list) {
    const l = g.last[0].toUpperCase();
    if (!map[l]) map[l] = [];
    map[l].push(g);
  }
  return map;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function highlight(text, term) {
  if (!term) return esc(text);
  const re = new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return esc(text).replace(re,'<mark class="highlight">$1</mark>');
}

function filterGuests(val) { searchTerm = val.trim(); render(); }

function render() {
  const sections = document.getElementById('guest-sections');
  const nav = document.getElementById('alpha-nav');
  const allLetters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

  let list = sorted();
  if (searchTerm) {
    const t = searchTerm.toLowerCase();
    list = list.filter(g => g.first.toLowerCase().includes(t) || g.last.toLowerCase().includes(t) || g.table.toLowerCase().includes(t));
  }

  const groups = grouped(list);
  const activeLetters = new Set(Object.keys(groups));

  nav.innerHTML = allLetters.map(l =>
    `<a ${activeLetters.has(l) ? `onclick="document.getElementById('letter-${l}').scrollIntoView({behavior:'smooth'})"` : ''} class="${activeLetters.has(l) ? '' : 'empty'}">${l}</a>`
  ).join('');

  if (list.length === 0) {
    sections.innerHTML = '<p class="no-results">No guests found.</p>';
    return;
  }

  sections.innerHTML = allLetters.filter(l => groups[l]).map(l => {
    const rows = groups[l].map(g => {
      const col = tableColor(tableNum(g.table));
      return `<li class="guest-row">
        <span class="guest-name"><span class="last">${highlight(g.last, searchTerm)}</span>, ${highlight(g.first, searchTerm)}</span>
        <span class="table-badge"><span class="table-dot" style="background:${col}"></span>${g.table}</span>
      </li>`;
    }).join('');
    return `<div class="letter-section" id="letter-${l}">
      <div class="letter-header"><span class="big-letter">${l}</span><div class="letter-rule"></div></div>
      <ul class="guest-list">${rows}</ul>
    </div>`;
  }).join('');
}
